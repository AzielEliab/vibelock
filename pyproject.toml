[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibelock"
version = "0.3.0"
description = "Physics + A/V deepfake detection: vocal-tract consistency, spatial/temporal image-video artifacts, and unnatural pitch/phase shifts (VibeLock, Aziel Eliab)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "audio",
    "forensics",
    "speech",
    "coherence",
    "liveness",
    "dsp",
    "biomechanics",
    "deepfake",
    "video",
    "image",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
tether = ["sounddevice>=0.4"]

[project.scripts]
vibelock = "vibelock.cli:main"
mialock = "mialock.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/vibelock"
Download = "https://github.com/AzielEliab/vibelock/releases"
Issues = "https://github.com/AzielEliab/vibelock/issues"

[tool.setuptools.packages.find]
include = ["vibelock*", "mialock*"]

[tool.setuptools.package-data]
mialock = ["data/*.json", "static/*", "static/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
